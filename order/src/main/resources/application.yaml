spring:
  application:
    name: order
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      show-sql: false
  profiles:
    active: default
  config:
    import: 'configserver:http://localhost:9030/'
  cloud:
    function:
      definition: inventoryResult;paymentResult;inventoryResultDlq;paymentResultDlq
    stream:
      bindings:
        paymentCommand-out-0:
          destination: payment.command
        inventoryCommand-out-0:
          destination: inventory.command
        paymentResult-in-0:
          destination: payment.result
          group: order
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2
            back-off-max-interval: 10000
        inventoryResult-in-0:
          destination: inventory.result
          group: order
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2
            back-off-max-interval: 10000
        inventoryResultDlq-in-0:
          destination: inventory.result.order.dlq
          group: order-dlq
        paymentResultDlq-in-0:
          destination: payment.result.order.dlq
          group: order-dlq
      rabbit:
        bindings:
          paymentResult-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
              dlq-ttl: 604800000
          inventoryResult-in-0:
            consumer:
              autoBindDlq: true
              republishToDlq: true
              dlq-ttl: 604800000
  lifecycle:
    timeout-per-shutdown-phase: 60s

server:
  port: 9000
  shutdown: graceful
   
info:
  app:
    name: Order
    description: "Single vendor ecommerce app Order Application"
    version: "1.0.0"
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true
  info:
    env:
      enabled: true
      
logging:
  level:
    com:
      storefront:
        order: DEBUG