spring:
  application:
    name: user
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      show-sql: false
  #profiles:
    #active: default
  config:
    import: 'configserver:http://localhost:9030/'
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:9035/eureka/
  instance:
    preferIpAddresss: true
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    
info:
  app:
   name: User
   description: "Single vendor ecommerce app User Application"
   version: "1.0.0"
   
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true
  info:
    env:
      enabled: true
      
logging:
  level:
    com:
      storefront:
        user: DEBUG