spring:
  application:
    name: product
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      show-sql: false
  profiles:
    active: default
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:9030/}"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    
server:
  port: 8090
  shutdown: graceful
  
info:
  app:
    name: Product
    description: "Single vendor ecommerce app Product Application"
    version: "1.0.0"
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true
    rabbit:
      enabled: true
    redis:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    enable:
      cache: true
      
logging:
  level:
    com.storefront: INFO
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%thread]
      %-5level
      [%X{correlationId}]
      %logger{36}
      - %msg%n