global:
  scrape_interval: 15s

scrape_configs:

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:9040

  - job_name: product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8090

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:9000

  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:9010

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:9020
          
  - job_name: user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8080