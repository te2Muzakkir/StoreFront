global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: gatewayserver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gatewayserver:9040

  - job_name: product
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - product:8090

  - job_name: order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order:9000

  - job_name: inventory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - inventory:9010

  - job_name: payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - payment:9020
          
  - job_name: user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user:8080
          
  - job_name: configserver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - configserver:8071

  - job_name: eurekaserver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - eurekaserver:8070
          