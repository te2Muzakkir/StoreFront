spring:
  application:
    name: eurekaserver
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'configserver:http://localhost:9030/'
    
server:
  port: 9035
  shutdown: graceful
  
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true