services:

  ###########################################################
  # Infrastructure
  ###########################################################

  postgres:
    image: postgres:17
    container_name: storefront-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - "D:/muzakkir/muzakkirlabs/StoreFront/StoreFront/infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
      - storefront_postgres-data:/var/lib/postgresql/data
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: storefront-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10


  redis:
    image: redis:8.8-alpine
    container_name: storefront-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ###########################################################
  # Spring Boot Services
  ###########################################################

  configserver:
    build:
      context: ./configserver
      dockerfile: Dockerfile.dev
    image: storefront-configserver
    container_name: storefront-configserver
    ports:
      - "9030:9030"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9030/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  eurekaserver:
    build:
      context: ./eurekaserver
      dockerfile: Dockerfile.dev
    image: storefront-eurekaserver
    container_name: storefront-eurekaserver
    ports:
      - "9035:9035"
    restart: unless-stopped
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9035/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  user:
    build:
      context: ./user
      dockerfile: Dockerfile.dev
    image: storefront-user
    container_name: storefront-user
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    volumes:
      - D:/muzakkir/muzakkirlabs/config/keys:/keys:ro
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_PRIVATE_KEY_LOCATION: file:/keys/private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/keys/public.pem
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  product:
    build:
      context: ./product
      dockerfile: Dockerfile.dev
    image: storefront-product
    container_name: storefront-product
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8090/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  order:
    build:
      context: ./order
      dockerfile: Dockerfile.dev
    image: storefront-order
    container_name: storefront-order
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9000/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  inventory:
    build:
      context: ./inventory
      dockerfile: Dockerfile.dev
    image: storefront-inventory
    container_name: storefront-inventory
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9010/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s


  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile.dev
    image: storefront-payment
    container_name: storefront-payment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9020/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
      
      
  gatewayserver:
    build:
      context: ./gatewayserver
      dockerfile: Dockerfile.dev
    image: storefront-gateway
    container_name: storefront-gateway
    ports:
      - "9040:9040"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      user:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    volumes:
      - D:/muzakkir/muzakkirlabs/config/keys:/keys:ro
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=75
      CONFIG_SERVER_URL: http://configserver:9030/
      EUREKA_SERVER_URL: http://eurekaserver:9035/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PUBLIC_KEY_LOCATION: file:/keys/public.pem
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9040/actuator/health/readiness"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
      
  ###########################################################
  # Infrastructure
  ###########################################################
  
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: storefront-prometheus
    restart: unless-stopped
    depends_on:
      gatewayserver:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:12.2.0
    container_name: storefront-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - storefront-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5


###########################################################
# Networks
###########################################################

networks:

  storefront-network:
    driver: bridge

###########################################################
# Volumes
###########################################################

volumes:

  storefront_postgres-data:
    external: true

  rabbitmq-data:

  redis-data:

  prometheus-data:

  grafana-data: