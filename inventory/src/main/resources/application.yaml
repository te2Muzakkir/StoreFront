spring:
  application:
    name: inventory
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      show-sql: false
  profiles:
    active: default
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:9030/}"
  cloud:
    function:
      definition: inventoryCommand;inventoryCommandDlq
    stream:
      bindings:
        inventoryCommand-in-0:
          destination: inventory.command
          group: inventory
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2
            back-off-max-interval: 10000
        inventoryResult-out-0:
          destination: inventory.result
        inventoryCommandDlq-in-0:
          destination: inventory.command.inventory.dlq
          group: inventory-dlq
      rabbit:
        bindings:
          inventoryCommand-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              dlqTtl: 604800000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    
server:
  port: 9010
  shutdown: graceful
  
info:
  app:
    name: Inventory
    description: "Single vendor ecommerce app Inventory Application"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true
    rabbit:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      enabled: true
    prometheus:
      access: read-only
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      
logging:
  level:
    com.storefront: INFO
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%thread]
      %-5level
      [%X{correlationId}]
      %logger{36}
      - %msg%n